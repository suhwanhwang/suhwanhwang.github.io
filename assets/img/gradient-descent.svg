<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
     role="img" aria-labelledby="gd-title gd-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="gd-title">경사하강법: 기울기의 반대 방향으로 내려간다</title>
  <desc id="gd-desc">가중치 값에 따른 손실 곡선. 왼쪽 비탈에 서 있는 지점의 접선이 아래로 기울어 있어, 기울기의 반대 방향인 오른쪽으로 한 걸음 옮기면 최저점에 가까워진다.</desc>

  <defs>
    <marker id="gd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="gd-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4532a"/>
    </marker>
  </defs>

  <!-- 축 -->
  <line x1="60" y1="316" x2="608" y2="316" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#gd-arrow)"/>
  <line x1="60" y1="316" x2="60" y2="34" stroke="#4a4a4a" stroke-width="1.2" marker-end="url(#gd-arrow)"/>
  <text x="600" y="338" font-size="14" fill="#4a4a4a" text-anchor="end">가중치 값</text>
  <text x="72" y="44" font-size="14" fill="#4a4a4a">손실</text>

  <!-- 손실 곡선 -->
  <polyline points="90,69.9 95,76.4 100,82.8 105,89.1 110,95.2 115,101.3 120,107.2 125,113.0 130,118.8 135,124.3 140,129.8 145,135.2 150,140.4 155,145.6 160,150.6 165,155.5 170,160.3 175,165.0 180,169.6 185,174.1 190,178.4 195,182.7 200,186.8 205,190.8 210,194.7 215,198.5 220,202.1 225,205.7 230,209.2 235,212.5 240,215.7 245,218.8 250,221.8 255,224.7 260,227.5 265,230.1 270,232.7 275,235.1 280,237.4 285,239.6 290,241.7 295,243.7 300,245.5 305,247.3 310,248.9 315,250.5 320,251.9 325,253.2 330,254.3 335,255.4 340,256.4 345,257.2 350,258.0 355,258.6 360,259.1 365,259.5 370,259.8 375,259.9 380,260.0 385,259.9 390,259.8 395,259.5 400,259.1 405,258.6 410,258.0 415,257.2 420,256.4 425,255.4 430,254.3 435,253.2 440,251.9 445,250.5 450,248.9 455,247.3 460,245.5 465,243.7 470,241.7 475,239.6 480,237.4 485,235.1 490,232.7 495,230.1 500,227.5 505,224.7 510,221.8 515,218.8 520,215.7 525,212.5 530,209.2 535,205.7 540,202.1 545,198.5 550,194.7 555,190.8 560,186.8 565,182.7 570,178.4 575,174.1 580,169.6" fill="none" stroke="#8a8a8a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 최저점 -->
  <line x1="380" y1="260.0" x2="380" y2="316" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="380" cy="260.0" r="4.5" fill="#8a8a8a"/>
  <text x="380" y="337" font-size="14" fill="#6a6a6a" text-anchor="middle">최저점</text>

  <!-- 접선: 왼쪽 위 끝에 이름표를 단다 -->
  <line x1="88.0" y1="76.0" x2="212.0" y2="204.9" stroke="#b4532a" stroke-width="2"/>
  <text x="92.0" y="66.0" font-size="13" fill="#b4532a">기울기(접선)</text>

  <!-- 지금 서 있는 자리: 곡선 오른쪽 위 빈 공간에 두고 지시선으로 연결 -->
  <line x1="196" y1="118" x2="159" y2="136" stroke="#b4532a" stroke-width="1"/>
  <text x="202" y="115" font-size="14" fill="#b4532a">지금 서 있는 자리</text>
  <circle cx="150" cy="140.4" r="6" fill="#b4532a"/>

  <!-- 이동 방향: 곡선 아래 빈 공간 -->
  <text x="185" y="250" font-size="14" fill="#b4532a" text-anchor="middle">기울기의 반대 방향으로</text>
  <text x="185" y="270" font-size="14" fill="#b4532a" text-anchor="middle">한 걸음 옮긴다</text>
  <path d="M 150 288 Q 250 299 338 303" fill="none" stroke="#b4532a" stroke-width="2"
        stroke-dasharray="6 5" marker-end="url(#gd-arrow-accent)"/>
</svg>
